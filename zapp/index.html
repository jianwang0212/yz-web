<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f7f3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zapp Store" />
    <meta
      name="description"
      content="A personal app store for shipping private tools to your phone and desktop."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/store.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css?v=20" />
    <title>Zapp Store</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="store-header">
        <div class="brand-lockup">
          <img src="icons/store.svg" alt="" class="store-mark" />
          <div>
            <p class="eyebrow">Personal App Store</p>
            <h1 id="storeName">Zapp Store</h1>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-button" id="refreshButton" type="button" title="刷新应用清单">
            <span aria-hidden="true">↻</span>
          </button>
          <button class="install-button" id="installButton" type="button" hidden>安装</button>
        </div>
      </header>

      <section class="toolbar" aria-label="Store controls">
        <div class="mode-tabs" id="viewTabs" role="tablist" aria-label="应用视图"></div>
        <label class="search-field">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索" autocomplete="off" />
        </label>
      </section>

      <section class="summary-row" aria-live="polite">
        <span><strong id="appCount">0</strong> apps</span>
        <span id="updatedLabel">Updated --</span>
        <span id="displayModeLabel">Browser</span>
        <span id="networkLabel">Online</span>
      </section>

      <section class="category-stack" id="categoryStack" aria-label="Apps by category"></section>

      <section class="empty-state" id="emptyState" hidden>没有找到匹配的应用。</section>

      <footer class="store-footer">
        <span id="footerOwner">Private shelf</span>
        <span id="buildLabel">Build --</span>
      </footer>
    </main>

    <template id="appTileTemplate">
      <article class="app-tile" tabindex="0">
        <img class="app-tile__icon" alt="" />
        <div class="app-tile__body">
          <h3></h3>
          <p></p>
        </div>
        <a class="open-button">Open</a>
      </article>
    </template>

    <div class="detail-overlay" id="detailOverlay" hidden>
      <article class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <header class="detail-header">
          <img id="detailIcon" alt="" />
          <div>
            <p id="detailCategory"></p>
            <h2 id="detailTitle"></h2>
          </div>
          <button class="icon-button" id="detailClose" type="button" title="关闭">
            <span aria-hidden="true">×</span>
          </button>
        </header>
        <p class="detail-description" id="detailDescription"></p>
        <dl class="detail-list" id="detailList"></dl>
        <a class="open-button detail-open" id="detailOpen">Open</a>
      </article>
    </div>

    <script type="module" src="app.js?v=21"></script>
  </body>
</html>
