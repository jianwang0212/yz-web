<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f7f3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Calculator" />
    <link rel="manifest" href="calculator.webmanifest" />
    <link rel="icon" href="../icons/apps/calculator.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../icons/apps/calculator-192.png" />
    <link rel="stylesheet" href="calculator.css" />
    <title>Calculator</title>
  </head>
  <body>
    <main class="calculator-shell">
      <header class="topbar">
        <a href="../" class="back-button" aria-label="返回 Zapp Store">←</a>
        <div>
          <p>Tools</p>
          <h1>Calculator</h1>
        </div>
      </header>

      <section class="calculator" aria-label="Calculator">
        <div class="display" aria-live="polite">
          <div class="expression" id="expression">0</div>
          <output class="result" id="result">0</output>
        </div>

        <div class="keys">
          <button type="button" data-action="clear" class="muted">AC</button>
          <button type="button" data-action="delete" class="muted">⌫</button>
          <button type="button" data-value="%" class="muted">%</button>
          <button type="button" data-value="/" class="operator">÷</button>

          <button type="button" data-value="7">7</button>
          <button type="button" data-value="8">8</button>
          <button type="button" data-value="9">9</button>
          <button type="button" data-value="*" class="operator">×</button>

          <button type="button" data-value="4">4</button>
          <button type="button" data-value="5">5</button>
          <button type="button" data-value="6">6</button>
          <button type="button" data-value="-" class="operator">−</button>

          <button type="button" data-value="1">1</button>
          <button type="button" data-value="2">2</button>
          <button type="button" data-value="3">3</button>
          <button type="button" data-value="+" class="operator">+</button>

          <button type="button" data-value="0" class="wide">0</button>
          <button type="button" data-value=".">.</button>
          <button type="button" data-action="equals" class="equals">=</button>
        </div>
      </section>
    </main>

    <script type="module" src="calculator.js"></script>
  </body>
</html>
