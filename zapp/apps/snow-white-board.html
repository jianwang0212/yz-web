<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f7f3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Snow White Board" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icons/apps/snow-white-board.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../icons/icon-192.png" />
    <link rel="stylesheet" href="snow-white-board.css" />
    <title>Snow White Board</title>
  </head>
  <body>
    <main class="board-shell">
      <header class="topbar">
        <a href="../" class="back-button" aria-label="返回 Zapp Store">←</a>
        <div class="title-block">
          <p>Creative Progress</p>
          <h1>Snow White Board</h1>
        </div>
        <a class="archive-link" href="https://thisisyz.com/snow-white" target="_blank" rel="noreferrer">Archive</a>
      </header>

      <section class="progress-panel" aria-label="Project summary">
        <div>
          <strong id="progressPercent">0%</strong>
          <span>完成度</span>
        </div>
        <div>
          <strong id="openCount">0</strong>
          <span>待处理</span>
        </div>
        <div>
          <strong id="doneCount">0</strong>
          <span>已完成</span>
        </div>
      </section>

      <section class="progress-meter" aria-label="Progress meter">
        <div id="progressBar"></div>
      </section>

      <section class="quick-add" aria-label="Add task">
        <form id="taskForm">
          <label>
            <span>阶段</span>
            <select name="stage">
              <option value="writing">Writing</option>
              <option value="production">Production</option>
              <option value="release">Release</option>
            </select>
          </label>
          <label>
            <span>任务</span>
            <input name="title" type="text" placeholder="例如：录一版副歌和声" required />
          </label>
          <label class="wide-field">
            <span>备注</span>
            <input name="note" type="text" placeholder="下一步、阻塞点、灵感片段" />
          </label>
          <button type="submit">Add</button>
        </form>
      </section>

      <section class="lanes" id="lanes" aria-label="Project stages"></section>

      <section class="notes-panel" aria-label="Project note">
        <div>
          <h2>今日创作焦点</h2>
          <p id="focusLine">把下一步变小，小到今天可以完成。</p>
        </div>
        <button type="button" id="exportButton">Export</button>
      </section>
    </main>

    <script type="module" src="snow-white-board.js"></script>
  </body>
</html>
