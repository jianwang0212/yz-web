<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="银子语音" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icons/apps/live-call.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../icons/icon-192.png" />
    <link rel="stylesheet" href="live-call.css?v=13" />
    <title>银子语音</title>
  </head>
  <body>
    <main class="voice-screen" aria-label="银子 AI 语音通话">
      <header class="voice-header">
        <a class="back-link" href="../" aria-label="返回 Zapp Store">‹</a>
        <div>
          <h1>银子 <span>语音</span></h1>
          <p id="statusText">点麦克风开始说话</p>
        </div>
      </header>

      <section class="voice-stage" aria-live="polite">
        <button class="orb" id="callButton" type="button" aria-label="开始语音输入">
          <span class="orb-core"></span>
        </button>
        <p class="live-caption" id="liveCaption">真人语音输入 · Zi style clone · ElevenLabs voice</p>
        <p class="reply-caption" id="replyCaption"></p>
        <button class="play-reply-button" id="playReplyButton" type="button" hidden>播放银子语音</button>
      </section>

      <section class="transcript-panel" id="transcriptPanel" aria-label="最近对话"></section>

      <form class="voice-composer" id="chatForm">
        <button class="round-button" id="resetButton" type="button" aria-label="清空">+</button>
        <textarea id="messageInput" rows="1" maxlength="1200" placeholder="询问银子" required></textarea>
        <button class="round-button mic-button" id="micButton" type="button" aria-label="开始语音输入">●</button>
        <button class="round-button close-button" id="hangupButton" type="button" aria-label="结束语音">×</button>
      </form>
    </main>

    <script src="live-call.js?v=13"></script>
  </body>
</html>
