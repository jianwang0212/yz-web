<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zi Health" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icons/apps/zi-health.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../icons/icon-192.png" />
    <title>Zi Health</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101418;
        --panel: #171d22;
        --surface: #21292f;
        --text: #f5f1e8;
        --muted: #aeb8b7;
        --line: #313c43;
        --blue: #6fb7d6;
        --green: #77c56f;
        --gold: #d9b45f;
        --red: #e85b5b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background: var(--bg);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "PingFang SC",
          sans-serif;
        letter-spacing: 0;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .shell {
        width: min(100%, 860px);
        min-height: 100vh;
        margin: 0 auto;
        padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      }

      .topbar,
      .brand,
      .status,
      .launch {
        display: flex;
        align-items: center;
      }

      .topbar {
        gap: 12px;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .brand {
        min-width: 0;
        gap: 12px;
      }

      .back {
        width: 42px;
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #151b20;
        font-size: 22px;
        font-weight: 800;
      }

      .mark {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        flex: 0 0 auto;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 20px;
        line-height: 1.05;
      }

      .subtitle {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.25;
      }

      .status {
        gap: 7px;
        min-height: 32px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--muted);
        background: #12181c;
        white-space: nowrap;
        font-size: 12px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 3px rgba(119, 197, 111, 0.16);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 16px;
      }

      .metric {
        min-height: 82px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .metric strong {
        display: block;
        overflow-wrap: anywhere;
        font-size: clamp(20px, 7vw, 30px);
        line-height: 1;
        letter-spacing: 0;
      }

      .metric span {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.25;
      }

      .section-title {
        margin: 18px 0 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .grid {
        display: grid;
        gap: 8px;
      }

      .launch {
        gap: 12px;
        min-height: 56px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        font-size: 15px;
        font-weight: 750;
      }

      .launch:active {
        transform: translateY(1px);
      }

      .glyph {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        color: var(--blue);
        flex: 0 0 auto;
      }

      .glyph svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .launch:nth-child(2) .glyph {
        color: var(--gold);
      }

      .launch:nth-child(3) .glyph {
        color: #a7c9e7;
      }

      .launch:nth-child(4) .glyph {
        color: var(--green);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
        color: var(--muted);
        font-size: 11px;
      }

      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 8px;
        background: #12181c;
      }

      @media (min-width: 680px) {
        .metrics {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <a href="../" class="back" aria-label="返回 Zapp Store">‹</a>
          <img class="mark" src="../icons/apps/zi-health.svg" alt="" />
          <div>
            <h1>Zi Health</h1>
            <p class="subtitle">Apple Health / Grafana / Records</p>
          </div>
        </div>
        <div class="status"><span class="dot"></span><span>Online</span></div>
      </header>

      <section class="metrics" aria-label="Health summary">
        <div class="metric"><strong>4,281,406</strong><span>Apple Health records</span></div>
        <div class="metric"><strong>1,048,614</strong><span>Route points</span></div>
        <div class="metric"><strong>504</strong><span>Documents</span></div>
        <div class="metric"><strong>2026-05-13</strong><span>Latest day</span></div>
      </section>

      <div class="section-title">Dashboards</div>
      <section class="grid">
        <a class="launch" href="https://thisisyz.com/health/grafana/d/apple-health/apple-health?orgId=1&from=now-90d&to=now&timezone=browser&var-metrics=$__all&var-device=$__all">
          <span class="glyph"><svg viewBox="0 0 24 24"><path d="M4 12h4l2-6 4 12 2-6h4" /></svg></span>
          <span>Apple Health Grafana</span>
        </a>
        <a class="launch" href="https://thisisyz.com/health/grafana/d/specific-metrics/apple-health-specific-metrics">
          <span class="glyph"><svg viewBox="0 0 24 24"><path d="M4 19V5M8 17V9M12 17V7M16 17v-4M20 17V3" /></svg></span>
          <span>Specific Metrics</span>
        </a>
        <a class="launch" href="https://thisisyz.com/health/grafana/d/a46f7443-1bc1-478d-8100-40c05aef654c/sleep-tracking-dashboard">
          <span class="glyph"><svg viewBox="0 0 24 24"><path d="M20 16.6A8 8 0 0 1 7.4 4 9 9 0 1 0 20 16.6z" /></svg></span>
          <span>Sleep Tracking</span>
        </a>
        <a class="launch" href="https://thisisyz.com/health/grafana/d/KU8Nj714z/workout-routes">
          <span class="glyph"><svg viewBox="0 0 24 24"><path d="M5 19c4-8 10 2 14-8M5 5h.01M19 19h.01" /></svg></span>
          <span>Workout Routes</span>
        </a>
        <a class="launch" href="https://thisisyz.com/health/records/">
          <span class="glyph"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7zM14 3v5h5M9 13h6M9 17h6" /></svg></span>
          <span>Records Vault</span>
        </a>
      </section>

      <div class="meta">
        <span class="pill">thisisyz.com/health</span>
        <span class="pill">Build 3</span>
        <span class="pill">2026-05-13</span>
      </div>
    </main>
  </body>
</html>
