    <main class="stem-shell">
      <header class="stem-header">
        <a href="/projects.html" class="back-button" aria-label="返回项目页">←</a>
        <div class="stem-title">
          <img src="/zapp/icons/apps/music-tool.svg" alt="" />
          <div>
            <p>Music Lab</p>
            <h1>Stem Splitter</h1>
          </div>
        </div>
      </header>

      <section class="stem-meta" aria-label="Pipeline status">
        <div>
          <strong id="songMeta">喜剧之王</strong>
          <span>Track</span>
        </div>
        <div>
          <strong>Demucs v4</strong>
          <span>Engine</span>
        </div>
        <div>
          <strong id="engineState">Checking</strong>
          <span>Local API</span>
        </div>
      </section>

      <section class="stem-workspace">
        <form class="input-panel" id="stemForm">
          <div class="field-grid">
            <label class="field">
              <span>歌名</span>
              <input id="songTitle" name="title" value="喜剧之王" autocomplete="off" required />
            </label>
            <label class="field">
              <span>歌手</span>
              <input id="artistName" name="artist" value="李荣浩" autocomplete="off" required />
            </label>
          </div>

          <div class="source-actions">
            <button class="secondary-button" id="youtubeButton" type="button">YouTube</button>
            <a class="secondary-button" href="https://github.com/facebookresearch/demucs" target="_blank" rel="noreferrer">Demucs</a>
          </div>

          <label class="drop-zone" id="dropZone">
            <input id="audioFile" type="file" accept="audio/*,.mp3,.wav,.m4a,.flac,.aac,.ogg" />
            <span>Original audio</span>
            <strong id="fileName">选择 MP3 / WAV / M4A</strong>
            <small id="fileMeta">本地文件</small>
          </label>

          <section class="engine-panel" aria-label="Engine">
            <div class="engine-card is-active">
              <strong>Demucs</strong>
              <span>vocals + no_vocals</span>
            </div>
            <div class="engine-card">
              <strong>Audio Separator</strong>
              <span>UVR models</span>
            </div>
            <div class="engine-card">
              <strong>Open-Unmix</strong>
              <span>4 stems</span>
            </div>
          </section>

          <div class="action-row">
            <button class="primary-button" id="splitButton" type="submit">分离 Stems</button>
            <button class="secondary-button" id="resetButton" type="button">清空</button>
          </div>

          <p class="status-line" id="statusLine" aria-live="polite"></p>
        </form>

        <section class="output-panel" aria-label="Outputs">
          <div class="output-heading">
            <div>
              <p>Output</p>
              <h2 id="outputTitle">等待音频</h2>
            </div>
            <div class="output-tools">
              <button class="secondary-button" id="openFolderButton" type="button" hidden>打开文件夹</button>
              <span id="jobBadge">--</span>
            </div>
          </div>

          <div class="global-seek" id="globalSeek" hidden>
            <input id="globalSeekSlider" type="range" min="0" max="1000" value="0" step="1" aria-label="播放位置" />
            <span id="globalSeekTime">0:00 / --</span>
          </div>

          <div class="stem-stack">
            <article class="stem-track" data-state="empty" id="originalTrack">
              <div>
                <p>Original</p>
                <h3>original.mp3</h3>
              </div>
              <audio id="originalAudio" preload="metadata" hidden></audio>
              <button class="track-play-button secondary-button" id="originalPlay" type="button" hidden>播放</button>
              <a class="download-button" id="originalDownload" href="#" download hidden>下载</a>
            </article>

            <article class="stem-track" data-state="empty" id="vocalTrack">
              <div>
                <p>Vocal</p>
                <h3>vocals.mp3</h3>
              </div>
              <audio id="vocalAudio" preload="metadata" hidden></audio>
              <button class="track-play-button secondary-button" id="vocalPlay" type="button" hidden>播放</button>
              <a class="download-button" id="vocalDownload" href="#" download hidden>下载</a>
            </article>

            <article class="stem-track" data-state="empty" id="bgmTrack">
              <div>
                <p>BGM</p>
                <h3>bgm.mp3</h3>
              </div>
              <audio id="bgmAudio" preload="metadata" hidden></audio>
              <button class="track-play-button secondary-button" id="bgmPlay" type="button" hidden>播放</button>
              <a class="download-button" id="bgmDownload" href="#" download hidden>下载</a>
            </article>
          </div>
        </section>
      </section>
    </main>

    <script src="/i18n.js?v=20260722-public-copy1" defer></script>
    <script src="/script.js?v=20260720-language-availability1" defer></script>

</html>
