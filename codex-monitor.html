<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Codex Monitor - 本地 MacBookPro 的公开同步摘要">
    <title>Codex Monitor · MacBookPro - Zi Yin (银子)</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .cm-shell {
            padding-top: 110px;
            padding-bottom: 80px;
        }

        .cm-hero,
        .cm-panel {
            background: linear-gradient(180deg, rgba(17,24,39,0.94), rgba(15,23,42,0.88));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            color: #fff;
            box-shadow: 0 24px 48px rgba(15,23,42,0.18);
        }

        .cm-hero {
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            gap: 1.5rem;
            align-items: flex-start;
            margin-bottom: 1.25rem;
        }

        .cm-kicker {
            margin: 0 0 0.4rem;
            color: #7dd3fc;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .cm-title {
            margin: 0;
            font-size: clamp(2rem, 4.2vw, 3.6rem);
            line-height: 1.04;
        }

        .cm-subtitle {
            margin: 0.7rem 0 0;
            color: rgba(255,255,255,0.72);
            font-size: 1rem;
        }

        .cm-controls {
            margin-top: 1.1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
            align-items: center;
        }

        .cm-control {
            display: inline-flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .cm-control-label {
            font-size: 0.76rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.54);
        }

        .cm-select {
            min-width: 220px;
            padding: 0.78rem 0.95rem;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06);
            color: #fff;
            font: inherit;
            outline: none;
        }

        .cm-select option {
            color: #0f172a;
        }

        .cm-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.8rem 1rem;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.05);
            white-space: nowrap;
            font-weight: 600;
        }

        .cm-pill::before {
            content: "";
            width: 0.65rem;
            height: 0.65rem;
            border-radius: 999px;
            background: #34d399;
            box-shadow: 0 0 12px currentColor;
        }

        .cm-pill.stale::before {
            background: #f59e0b;
        }

        .cm-pill.offline::before {
            background: #ef4444;
        }

        .cm-meta {
            display: grid;
            gap: 0.45rem;
            text-align: right;
            color: rgba(255,255,255,0.66);
            font-size: 0.94rem;
        }

        .cm-summary-grid,
        .cm-chart-grid,
        .cm-detail-grid {
            display: grid;
            gap: 1rem;
            margin-top: 1rem;
        }

        .cm-summary-grid {
            grid-template-columns: repeat(6, minmax(0, 1fr));
        }

        .cm-chart-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .cm-detail-grid {
            grid-template-columns: 1.45fr 1fr;
        }

        .cm-analysis {
            margin-top: 1rem;
            display: grid;
            grid-template-columns: 1fr 1.35fr;
            gap: 1rem;
        }

        .cm-analysis-main {
            display: grid;
            gap: 1rem;
        }

        .cm-analysis-kicker {
            color: #7dd3fc;
            font-size: 0.76rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-weight: 700;
        }

        .cm-analysis-headline {
            margin: 0.35rem 0 0;
            font-size: clamp(1.8rem, 3vw, 2.7rem);
            line-height: 1.08;
        }

        .cm-analysis-body {
            margin: 0.75rem 0 0;
            color: rgba(255,255,255,0.7);
            line-height: 1.7;
        }

        .cm-meter {
            overflow: hidden;
            height: 0.7rem;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.08);
        }

        .cm-meter-fill {
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, #34d399, #fbbf24, #fb7185);
            transition: width 0.35s ease;
        }

        .cm-analysis-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.8rem;
        }

        .cm-mini-card {
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            background: rgba(255,255,255,0.05);
            padding: 1rem;
        }

        .cm-mini-label {
            color: rgba(255,255,255,0.58);
            font-size: 0.76rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .cm-mini-value {
            margin-top: 0.45rem;
            font-size: 1.45rem;
            font-weight: 800;
            line-height: 1.1;
        }

        .cm-mini-hint {
            margin-top: 0.45rem;
            color: rgba(255,255,255,0.58);
            font-size: 0.88rem;
            line-height: 1.5;
        }

        .cm-card,
        .cm-panel {
            padding: 1.2rem 1.25rem 1.3rem;
        }

        .cm-card {
            background: linear-gradient(180deg, rgba(17,24,39,0.92), rgba(15,23,42,0.84));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            color: #fff;
        }

        .cm-card-label {
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.6);
        }

        .cm-card-value {
            margin-top: 0.7rem;
            font-size: 2rem;
            font-weight: 700;
            line-height: 1;
        }

        .cm-card-hint {
            margin-top: 0.65rem;
            color: rgba(255,255,255,0.64);
            font-size: 0.92rem;
        }

        .cm-panel-header {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            align-items: baseline;
            margin-bottom: 1rem;
        }

        .cm-panel-title {
            margin: 0;
            font-size: 1.15rem;
            color: #fff;
        }

        .cm-panel-subtitle {
            color: rgba(255,255,255,0.58);
            font-size: 0.9rem;
        }

        .cm-chart {
            width: 100%;
            height: 210px;
            display: block;
        }

        .cm-list {
            display: grid;
            gap: 0.85rem;
        }

        .cm-list-item {
            display: grid;
            gap: 0.28rem;
            padding-bottom: 0.85rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .cm-list-item:last-child {
            border-bottom: 0;
            padding-bottom: 0;
        }

        .cm-row {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            align-items: center;
        }

        .cm-muted {
            color: rgba(255,255,255,0.62);
        }

        .cm-empty {
            padding: 1.4rem 0.4rem;
            color: rgba(255,255,255,0.62);
            text-align: center;
        }

        @media (max-width: 1180px) {
            .cm-summary-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .cm-chart-grid,
            .cm-analysis,
            .cm-detail-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 860px) {
            .cm-hero {
                flex-direction: column;
            }

            .cm-meta {
                text-align: left;
            }

            .cm-summary-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .cm-analysis-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <script>
        const machinePresets = [
            {
                id: 'macbookpro',
                name: 'MacBookPro',
                label: '本地 MacBookPro'
            },
            {
                id: 'windows-pc',
                name: 'Windows PC',
                label: '本地 Windows PC'
            }
        ];

        let machineQuery = new URLSearchParams(window.location.search).get('machine') || 'macbookpro';
        const summaryEl = document.getElementById('cm-summary');
        const kickerEl = document.getElementById('cm-kicker');
        const titleEl = document.getElementById('cm-title');
        const subtitleEl = document.getElementById('cm-subtitle');
        const syncTimeEl = document.getElementById('cm-sync-time');
        const statusEl = document.getElementById('cm-status');
        const sourceEl = document.getElementById('cm-source');
        const agentsEl = document.getElementById('cm-agents');
        const modelsEl = document.getElementById('cm-models');
        const machineSelectEl = document.getElementById('cm-machine-select');

        const compact = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 });
        const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 });
        const percent = new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 1 });
        const officialCodexUsage = {
            source: 'OpenAI Codex Settings',
            capturedAt: '2026-04-25 02:01 ET',
            fiveHourRemaining: 86,
            weeklyRemaining: 1,
            sparkFiveHourRemaining: 100,
            sparkWeeklyRemaining: 97,
            creditBalance: 0,
            fiveHourReset: '4:27',
            weeklyReset: '2026年4月28日 14:56',
            monthThreads: 169,
            monthTurns: 852,
            averageThreadsPerDay: 5.6,
            averageTurnsPerDay: 28.4
        };
        const analysisEl = document.getElementById('cm-analysis');

        function formatNumber(value) {
            return compact.format(value || 0);
        }

        function formatBytes(bytes) {
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let value = bytes || 0;
            let index = 0;
            while (value >= 1024 && index < units.length - 1) {
                value /= 1024;
                index += 1;
            }
            return `${value.toFixed(value >= 100 ? 0 : value >= 10 ? 1 : 2)} ${units[index]}`;
        }

        function formatPercent(value) {
            return `${(value || 0).toFixed(value > 100 ? 0 : 1)}%`;
        }

        function formatMoney(value) {
            return money.format(value || 0);
        }

        function formatLongNumber(value) {
            return new Intl.NumberFormat('zh-CN').format(Math.round(value || 0));
        }

        function formatUsagePercent(value) {
            if (!Number.isFinite(value)) return 'n/a';
            return `${percent.format(value)}%`;
        }

        function formatDuration(minutes) {
            const safeMinutes = Math.max(0, Math.round(minutes || 0));
            if (safeMinutes >= 60) {
                const hours = Math.floor(safeMinutes / 60);
                const restMinutes = safeMinutes % 60;
                return restMinutes ? `约 ${hours} 小时 ${restMinutes} 分` : `约 ${hours} 小时`;
            }
            return `约 ${safeMinutes} 分钟`;
        }

        function relativeTime(timestamp) {
            if (!timestamp) return 'n/a';
            const diff = Date.now() - new Date(timestamp).getTime();
            if (diff < 60000) return `${Math.max(1, Math.round(diff / 1000))} 秒前`;
            if (diff < 3600000) return `${Math.round(diff / 60000)} 分钟前`;
            if (diff < 86400000) return `${Math.round(diff / 3600000)} 小时前`;
            return `${Math.round(diff / 86400000)} 天前`;
        }

        function clock(timestamp) {
            return new Date(timestamp).toLocaleString('zh-CN', {
                hour12: false,
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function slugify(value) {
            return String(value || '')
                .trim()
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '') || 'macbookpro';
        }

        function getMachineMeta(payload) {
            const syncedMachines = Array.isArray(payload?.machines) ? payload.machines : [];
            const latestMachine = payload?.latest?.machine || null;
            const machineMap = new Map();

            machinePresets.forEach((machine) => {
                machineMap.set(machine.id, { ...machine, available: false });
            });

            syncedMachines.forEach((machine) => {
                const id = slugify(machine.id || machine.name);
                machineMap.set(id, {
                    id,
                    name: machine.name || machineMap.get(id)?.name || id,
                    label: machine.label || machineMap.get(id)?.label || machine.name || id,
                    available: true
                });
            });

            if (latestMachine?.id || latestMachine?.name) {
                const id = slugify(latestMachine.id || latestMachine.name);
                machineMap.set(id, {
                    id,
                    name: latestMachine.name || machineMap.get(id)?.name || id,
                    label: latestMachine.label || machineMap.get(id)?.label || latestMachine.name || id,
                    available: true
                });
            }

            if (!machineMap.has(machineQuery)) {
                machineMap.set(machineQuery, {
                    id: machineQuery,
                    name: machineQuery,
                    label: machineQuery,
                    available: false
                });
            }

            return Array.from(machineMap.values());
        }

        function syncMachineQueryToUrl() {
            const url = new URL(window.location.href);
            url.searchParams.set('machine', machineQuery);
            window.history.replaceState({}, '', url);
        }

        function renderMachineSelect(payload) {
            const machines = getMachineMeta(payload);
            machineSelectEl.innerHTML = machines.map((machine) => `
                <option value="${machine.id}">
                    ${machine.name}${machine.available ? '' : '（尚未同步）'}
                </option>
            `).join('');
            machineSelectEl.value = machines.some((machine) => machine.id === machineQuery) ? machineQuery : machines[0]?.id || 'macbookpro';
        }

        function renderSummary(latest) {
            const summary = latest?.summary || {};
            const cards = [
                ['Active Agents', String(summary.visibleActiveAgents ?? summary.activeAgents ?? 0), '当前公开展示的活跃 agent 数量'],
                ['Tokens Today', formatNumber(summary.todayTokens), '今日累计 tokens'],
                ['Weekly Usage', formatNumber(summary.weekTokens), '最近 7 天累计 tokens'],
                ['Estimated Cost', formatMoney(summary.estimatedCostUsd), '公开成本估算'],
                ['CPU', formatPercent(summary.cpu), '本地 Codex 相关 CPU 汇总'],
                ['Memory', formatBytes(summary.memoryBytes), '本地 Codex 相关内存汇总']
            ];

            summaryEl.innerHTML = cards.map(([label, value, hint]) => `
                <article class="cm-card">
                    <div class="cm-card-label">${label}</div>
                    <div class="cm-card-value">${value}</div>
                    <div class="cm-card-hint">${hint}</div>
                </article>
            `).join('');
        }

        function renderUsageAnalysis(latest) {
            const summary = latest?.summary || {};
            const usedTokens = Number(summary.totalTokens || summary.weekTokens || summary.todayTokens || 0);
            const estimatedCost = Number(summary.estimatedCostUsd || 0);
            const fiveHourUsed = 100 - officialCodexUsage.fiveHourRemaining;
            const weeklyUsed = 100 - officialCodexUsage.weeklyRemaining;
            const sparkFiveHourUsed = 100 - officialCodexUsage.sparkFiveHourRemaining;
            const sparkWeeklyUsed = 100 - officialCodexUsage.sparkWeeklyRemaining;
            const weeklyMeter = Math.max(0, Math.min(100, weeklyUsed));
            const plusEquivalentWeeklyUse = weeklyUsed * 20 / 100;
            const conclusion = weeklyUsed >= 50 || fiveHourUsed >= 50
                ? '不建议降级到 Plus。官方账户数据显示，你已经用掉了 Pro 的大部分 Codex 周额度。'
                : '可以考虑降级到 Plus，但需要继续观察一周。';

            analysisEl.innerHTML = `
                <article class="cm-panel cm-analysis-main">
                    <div>
                        <div class="cm-analysis-kicker">Usage Analysis</div>
                        <h2 class="cm-analysis-headline">${conclusion}</h2>
                        <p class="cm-analysis-body">
                            主 Codex 额度：5 小时已用约 ${formatUsagePercent(fiveHourUsed)}，每周已用约 ${formatUsagePercent(weeklyUsed)}。
                            Spark 专项额度：GPT-5.3-Codex-Spark 的 5 小时和每周额度都还剩 ${officialCodexUsage.sparkWeeklyRemaining}%。
                            最近 1 个月活动：${officialCodexUsage.monthThreads} threads，${officialCodexUsage.monthTurns} turns，平均每天 ${officialCodexUsage.averageThreadsPerDay} threads / ${officialCodexUsage.averageTurnsPerDay} turns。
                        </p>
                    </div>
                    <div>
                        <div class="cm-row cm-muted">
                            <span>官方 Pro 周额度已用</span>
                            <strong>${formatUsagePercent(weeklyUsed)}</strong>
                        </div>
                        <div class="cm-meter" aria-label="Official weekly Codex usage meter">
                            <div class="cm-meter-fill" style="width: ${weeklyMeter}%"></div>
                        </div>
                    </div>
                </article>
                <article class="cm-panel">
                    <div class="cm-panel-header">
                        <h2 class="cm-panel-title">官方账户读数</h2>
                        <span class="cm-panel-subtitle">${officialCodexUsage.source} · ${officialCodexUsage.capturedAt}</span>
                    </div>
                    <div class="cm-analysis-grid">
                        <div class="cm-mini-card">
                            <div class="cm-mini-label">5 小时额度</div>
                            <div class="cm-mini-value">${formatUsagePercent(fiveHourUsed)}</div>
                            <div class="cm-mini-hint">剩 ${officialCodexUsage.fiveHourRemaining}% · 重置 ${officialCodexUsage.fiveHourReset}</div>
                        </div>
                        <div class="cm-mini-card">
                            <div class="cm-mini-label">每周额度</div>
                            <div class="cm-mini-value">${formatUsagePercent(weeklyUsed)}</div>
                            <div class="cm-mini-hint">剩 ${officialCodexUsage.weeklyRemaining}% · 重置 ${officialCodexUsage.weeklyReset}</div>
                        </div>
                        <div class="cm-mini-card">
                            <div class="cm-mini-label">Spark 专项</div>
                            <div class="cm-mini-value">${officialCodexUsage.sparkWeeklyRemaining}% 剩余</div>
                            <div class="cm-mini-hint">GPT-5.3-Codex-Spark：5 小时已用 ${formatUsagePercent(sparkFiveHourUsed)} · 周额度已用 ${formatUsagePercent(sparkWeeklyUsed)}</div>
                        </div>
                        <div class="cm-mini-card">
                            <div class="cm-mini-label">订阅建议</div>
                            <div class="cm-mini-value">保留 Pro</div>
                            <div class="cm-mini-hint">官方 Pro 周额度已用 ${formatUsagePercent(weeklyUsed)}；按 Pro 约 20x Plus 估算，已经约等于 ${plusEquivalentWeeklyUse.toFixed(1)} 个 Plus 周额度。</div>
                        </div>
                        <div class="cm-mini-card">
                            <div class="cm-mini-label">最近 1 个月活动</div>
                            <div class="cm-mini-value">${officialCodexUsage.monthThreads} / ${officialCodexUsage.monthTurns}</div>
                            <div class="cm-mini-hint">平均每天 ${officialCodexUsage.averageThreadsPerDay} threads / ${officialCodexUsage.averageTurnsPerDay} turns · 额外积分 ${officialCodexUsage.creditBalance}</div>
                        </div>
                    </div>
                </article>
            `;
        }

        function renderList(container, items, emptyText, renderer) {
            if (!items || items.length === 0) {
                container.innerHTML = `<div class="cm-empty">${emptyText}</div>`;
                return;
            }
            container.innerHTML = items.map(renderer).join('');
        }

        function renderLineChart(elementId, items, key, color, formatter) {
            const svg = document.getElementById(elementId);
            svg.innerHTML = '';
            if (!items || items.length === 0) {
                svg.innerHTML = `<text x="20" y="28" fill="rgba(255,255,255,0.58)" font-size="14">暂无历史</text>`;
                return;
            }

            const width = 600;
            const height = 210;
            const plot = { top: 12, right: 12, bottom: 36, left: 12 };
            const chartWidth = width - plot.left - plot.right;
            const chartHeight = height - plot.top - plot.bottom;
            const values = items.map((item) => item[key] || 0);
            const max = Math.max(...values);
            const min = Math.min(...values);
            const range = max - min || 1;
            const indexes = [...new Set([0, 0.5, 1].map((ratio) => Math.round((items.length - 1) * ratio)))];
            const coords = values.map((value, index) => {
                const x = plot.left + (index / Math.max(items.length - 1, 1)) * chartWidth;
                const y = plot.top + chartHeight - ((value - min) / range) * chartHeight;
                return `${x},${y}`;
            }).join(' ');
            const ticks = indexes.map((index) => {
                const x = plot.left + (index / Math.max(items.length - 1, 1)) * chartWidth;
                return `
                    <line x1="${x}" y1="${plot.top}" x2="${x}" y2="${plot.top + chartHeight}" stroke="rgba(255,255,255,0.05)" />
                    <text x="${x}" y="${height - 12}" fill="rgba(255,255,255,0.56)" font-size="11" text-anchor="${index === 0 ? 'start' : index === items.length - 1 ? 'end' : 'middle'}">${new Date(items[index].timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}</text>
                `;
            }).join('');

            svg.innerHTML = `
                <defs>
                    <linearGradient id="${elementId}-gradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="${color}" stop-opacity="0.28" />
                        <stop offset="100%" stop-color="${color}" stop-opacity="0" />
                    </linearGradient>
                </defs>
                <line x1="${plot.left}" y1="${plot.top}" x2="${width - plot.right}" y2="${plot.top}" stroke="rgba(255,255,255,0.05)" />
                <line x1="${plot.left}" y1="${plot.top + chartHeight / 2}" x2="${width - plot.right}" y2="${plot.top + chartHeight / 2}" stroke="rgba(255,255,255,0.05)" />
                <line x1="${plot.left}" y1="${plot.top + chartHeight}" x2="${width - plot.right}" y2="${plot.top + chartHeight}" stroke="rgba(255,255,255,0.05)" />
                ${ticks}
                <polyline points="${coords} ${width - plot.right},${plot.top + chartHeight} ${plot.left},${plot.top + chartHeight}" fill="url(#${elementId}-gradient)" opacity="0.7"></polyline>
                <polyline points="${coords}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></polyline>
                <text x="${plot.left}" y="26" fill="rgba(255,255,255,0.72)" font-size="13">${formatter(max)}</text>
                <text x="${width - plot.right}" y="26" fill="rgba(255,255,255,0.72)" font-size="12" text-anchor="end">最新 ${formatter(values.at(-1))}</text>
            `;
        }

        function renderDashboard(payload) {
            const latest = payload.latest;
            const machines = getMachineMeta(payload);
            const selectedMachine = machines.find((machine) => machine.id === machineQuery) || machinePresets[0];
            renderMachineSelect(payload);

            if (!latest) {
                kickerEl.textContent = `Local ${selectedMachine.name}`;
                titleEl.textContent = `${selectedMachine.name} · Codex Monitor`;
                subtitleEl.textContent = `${selectedMachine.label} · 尚未同步到网站`;
                statusEl.textContent = '未同步';
                statusEl.className = 'cm-pill offline';
                syncTimeEl.textContent = `尚未收到 ${selectedMachine.name} 的同步数据`;
                sourceEl.textContent = `来源：等待 ${selectedMachine.label}`;
                document.title = `${selectedMachine.name} · Codex Monitor - Zi Yin`;
                renderSummary(null);
                renderList(agentsEl, [], '暂无活跃 agent 数据', () => '');
                renderList(modelsEl, [], '暂无模型数据', () => '');
                renderLineChart('cm-cpu-chart', [], 'cpu', '#63d2ff', formatPercent);
                renderLineChart('cm-memory-chart', [], 'memoryBytes', '#34d399', formatBytes);
                renderLineChart('cm-token-chart', [], 'totalTokens', '#fbbf24', formatNumber);
                return;
            }

            kickerEl.textContent = `Local ${latest.machine.name}`;
            titleEl.textContent = `${latest.machine.name} · Codex Monitor`;
            subtitleEl.textContent = `${latest.machine.label} · 每 5 分钟同步一次公开摘要`;
            statusEl.textContent = latest.syncStatus === 'online' ? '在线' : latest.syncStatus === 'stale' ? '延迟' : '离线';
            statusEl.className = `cm-pill ${latest.syncStatus}`;
            syncTimeEl.textContent = `上次同步：${clock(latest.syncedAt)} · ${relativeTime(latest.syncedAt)}`;
            sourceEl.textContent = `来源：${latest.machine.label}`;
            document.title = `${latest.machine.name} · Codex Monitor - Zi Yin`;

            renderSummary(latest);
            renderList(
                agentsEl,
                latest.agentHighlights || latest.agents || [],
                '最近 1 天没有可用 agent 活动',
                (agent) => `
                    <div class="cm-list-item">
                        <div class="cm-row">
                            <strong>${agent.sessionTitle || agent.processName || agent.agentId}</strong>
                            <span class="cm-muted">${formatDuration(agent.approxActiveMinutes || 5)}</span>
                        </div>
                        <div class="cm-row cm-muted">
                            <span>${agent.workspaceLabel || '未标注项目'}</span>
                            <span>均值 ${formatPercent(agent.avgCpu ?? agent.cpu)} · 峰值 ${formatPercent(agent.peakCpu ?? agent.cpu)}</span>
                        </div>
                        <div class="cm-row cm-muted">
                            <span>${relativeTime(agent.lastSeenAt || latest.syncedAt)}</span>
                            <span>${formatBytes(agent.peakMemoryBytes ?? agent.memoryBytes)}</span>
                        </div>
                    </div>
                `
            );
            renderList(
                modelsEl,
                latest.models || [],
                '暂无模型数据',
                (model) => `
                    <div class="cm-list-item">
                        <div class="cm-row">
                            <strong>${model.model}</strong>
                            <span>${formatMoney(model.costUSD)}</span>
                        </div>
                        <div class="cm-row cm-muted">
                            <span>${formatNumber(model.totalTokens)} tokens</span>
                            <span>${formatNumber(model.inputTokens)} in / ${formatNumber(model.outputTokens)} out</span>
                        </div>
                    </div>
                `
            );
            renderLineChart('cm-cpu-chart', latest.history || [], 'cpu', '#63d2ff', formatPercent);
            renderLineChart('cm-memory-chart', latest.history || [], 'memoryBytes', '#34d399', formatBytes);
            renderLineChart('cm-token-chart', latest.history || [], 'totalTokens', '#fbbf24', formatNumber);
        }

        async function loadDashboard() {
            try {
                const response = await fetch(`/api/codex-monitor/latest?machine=${machineQuery}`, {
                    cache: 'no-store'
                });
                const payload = await response.json();
                renderDashboard(payload);
            } catch (error) {
                renderDashboard({ latest: null });
            }
        }

        machineSelectEl.addEventListener('change', () => {
            machineQuery = machineSelectEl.value;
            syncMachineQueryToUrl();
            loadDashboard();
        });

        renderUsageAnalysis();
        syncMachineQueryToUrl();
        loadDashboard();
        setInterval(loadDashboard, 60000);
    </script>
</body>
</html>
