<html lang="zh" id="html-lang">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="波士顿 1179 Boylston 公寓转租说明：给下一位租客的中英文交接页。">
    <title>波士顿公寓转租 · 给下一位租客 - Zi Yin (银子)</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .article-container {
            max-width: 760px;
            margin: 0 auto;
            padding: 2rem 1.25rem 4rem;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .back-link:hover {
            text-decoration: underline;
            color: var(--primary-dark);
        }

        .handoff {
            line-height: 1.75;
            color: var(--text-primary);
        }

        .handoff-header {
            margin-bottom: 2.5rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.06) 0%, transparent 100%);
            border-radius: 0 0 12px 12px;
            margin-left: -0.5rem;
            margin-right: -0.5rem;
            padding-left: 0.5rem;
            padding-right: 0.5rem;
        }

        .handoff h1 {
            font-size: clamp(1.65rem, 4vw, 2.1rem);
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .handoff .post-meta {
            font-size: 0.92rem;
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
        }

        .handoff .lead {
            font-size: 1.05rem;
            color: var(--text-secondary);
            max-width: 52ch;
        }

        .handoff h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 2.75rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .handoff h2::before {
            content: "";
            width: 4px;
            height: 1.1em;
            background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
            border-radius: 2px;
        }

        .fact-sheet {
            display: flex;
            flex-direction: column;
            gap: 0;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg-primary);
            box-shadow: var(--shadow-sm);
        }

        .fact-row {
            display: grid;
            grid-template-columns: minmax(100px, 140px) 1fr;
            gap: 1rem;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            align-items: start;
        }

        .fact-row:last-child {
            border-bottom: none;
        }

        .fact-label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--primary-color);
        }

        .fact-val {
            font-size: 0.98rem;
            color: var(--text-primary);
        }

        .fact-val a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .fact-val a:hover {
            text-decoration: underline;
        }

        .perk-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        @media (max-width: 720px) {
            .perk-grid {
                grid-template-columns: 1fr;
            }

            .fact-row {
                grid-template-columns: 1fr;
                gap: 0.35rem;
            }
        }

        .perk {
            padding: 1.25rem;
            border-radius: 12px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            background: linear-gradient(145deg, rgba(99, 102, 241, 0.07), rgba(139, 92, 246, 0.04));
        }

        .perk h4 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary-dark);
        }

        .perk p {
            font-size: 0.92rem;
            color: var(--text-primary);
            margin: 0;
            line-height: 1.55;
        }

        .handoff .body-p {
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .contact-line {
            margin-top: 1rem;
            padding: 1rem 1.25rem;
            background: var(--bg-secondary);
            border-radius: 10px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
        }

        .contact-line a {
            color: var(--primary-color);
            font-weight: 500;
        }

        .mono {
            font-family: ui-monospace, monospace;
            font-size: 0.9em;
        }

        .inv-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .inv-table thead {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.12), rgba(139, 92, 246, 0.08));
        }

        .inv-table th {
            text-align: left;
            padding: 0.85rem 1rem;
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary-dark);
        }

        .inv-table th.num,
        .inv-table td.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .inv-table td {
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .inv-table tbody tr:nth-child(even) {
            background: rgba(249, 250, 251, 0.8);
        }

        .note-muted {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-top: 1rem;
            font-style: italic;
        }

        .pdf-block {
            margin-top: 1rem;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px dashed rgba(99, 102, 241, 0.35);
            background: rgba(99, 102, 241, 0.04);
        }

        .pdf-lead {
            margin-bottom: 1rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .pdf-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.35rem;
            background: var(--primary-color);
            color: #fff !important;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 10px;
            transition: background 0.2s, transform 0.15s;
        }

        .pdf-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .qr-strip {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1.25rem;
            margin-top: 1.75rem;
            padding: 1.25rem 1.5rem;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: var(--shadow-sm);
            max-width: 100%;
        }

        .qr-strip img {
            width: 148px;
            height: 148px;
            flex-shrink: 0;
            border-radius: 10px;
            border: 1px solid rgba(99, 102, 241, 0.15);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .qr-strip figcaption {
            flex: 1;
            min-width: 200px;
            margin: 0;
            font-size: 0.98rem;
            color: var(--text-secondary);
            line-height: 1.55;
        }

        .qr-strip .qr-url {
            display: block;
            margin-top: 0.5rem;
            font-size: 0.85rem;
            font-family: ui-monospace, monospace;
            color: var(--primary-color);
            word-break: break-all;
        }
    </style>
