<!DOCTYPE html>
<html lang="en" id="html-lang">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Key Signature Degree Quiz — scale-degree drill across 12 major keys">
    <title>调号级数测试 · Zi Yin</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dq-cream: #f9f4ee;
            --dq-accent: #a3432f;
            --dq-accent-soft: rgba(163, 67, 47, 0.22);
            --dq-text: #1a1a1a;
            --dq-muted: #6b6560;
            --dq-card: #ffffff;
            --dq-chip-bg: #ebe6e0;
        }

        body.degree-quiz-body {
            background: var(--dq-cream) !important;
        }

        body.degree-quiz-body .navbar {
            background: rgba(255, 255, 255, 0.94) !important;
            border-bottom-color: rgba(0, 0, 0, 0.06);
        }

        body.degree-quiz-body .footer {
            background: transparent;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }

        .dq-page {
            max-width: 1040px;
            margin: 0 auto;
            padding: 2rem 1.15rem 3.5rem;
        }

        .dq-back {
            display: inline-block;
            margin-bottom: 1.25rem;
            color: var(--dq-accent);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .dq-back:hover {
            text-decoration: underline;
        }

        .dq-page-header {
            margin-bottom: 1.75rem;
            text-align: center;
        }

        .dq-page-header h1 {
            font-family: "Noto Serif SC", Georgia, "Times New Roman", serif;
            font-size: clamp(1.85rem, 4.5vw, 2.35rem);
            font-weight: 700;
            color: var(--dq-text);
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .dq-page-header .dq-sub {
            color: var(--dq-muted);
            font-size: 0.95rem;
            line-height: 1.65;
            max-width: 36rem;
            margin: 0 auto 1rem;
        }

        .dq-app-lang {
            display: flex;
            justify-content: center;
            gap: 0.45rem;
        }

        .dq-app-lang button {
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: #fff;
            font-size: 0.82rem;
            cursor: pointer;
            color: var(--dq-muted);
        }

        .dq-app-lang button.is-active {
            background: var(--dq-accent);
            color: #fff;
            border-color: var(--dq-accent);
        }

        .dq-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.15rem;
        }

        @media (min-width: 820px) {
            .dq-grid {
                grid-template-columns: 1fr 1fr;
                grid-auto-rows: minmax(min-content, auto);
            }

            .dq-card--span-full {
                grid-column: 1 / -1;
            }
        }

        .dq-card {
            background: var(--dq-card);
            border-radius: 14px;
            padding: 1.15rem 1.25rem 1.35rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .dq-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.9rem;
            gap: 0.75rem;
        }

        .dq-card-head .dq-head-primary {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--dq-text);
        }

        .dq-card-head .dq-head-secondary {
            font-size: 0.88rem;
            color: var(--dq-muted);
            font-weight: 500;
        }

        .dq-btn-ghost {
            padding: 0.38rem 0.85rem;
            border-radius: 8px;
            border: none;
            background: var(--dq-chip-bg);
            color: #3d3835;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }

        .dq-btn-ghost:hover {
            filter: brightness(0.97);
        }

        .dq-question {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--dq-text);
            margin-bottom: 1.1rem;
            line-height: 1.4;
        }

        .dq-form label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--dq-muted);
            margin-bottom: 0.4rem;
        }

        .dq-input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: stretch;
            margin-bottom: 0.65rem;
        }

        .dq-form input[type="text"] {
            flex: 1;
            min-width: 140px;
            padding: 0.65rem 0.85rem;
            border: 1px solid var(--dq-accent-soft);
            border-radius: 8px;
            font-size: 1rem;
            background: #fffefd;
        }

        .dq-form input[type="text"]:focus {
            outline: 2px solid rgba(163, 67, 47, 0.25);
            outline-offset: 1px;
        }

        .dq-btn-submit {
            padding: 0.65rem 1.25rem;
            border-radius: 8px;
            border: none;
            background: var(--dq-accent);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.08s ease, filter 0.15s ease;
        }

        .dq-btn-submit:hover {
            filter: brightness(0.98);
        }

        .dq-btn-submit:active {
            transform: translateY(1px);
        }

        .feedback {
            margin-top: 0.4rem;
            min-height: 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .feedback.success {
            color: #2f6a3a;
        }

        .feedback.error {
            color: var(--dq-accent);
        }

        .dq-reveal-link {
            margin-top: 0.6rem;
            border: none;
            background: none;
            padding: 0;
            color: var(--dq-accent);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .dq-reveal-link:hover {
            text-decoration: underline;
        }

        .dq-notes-title {
            font-size: 1.02rem;
            margin: 0 0 0.85rem;
            color: var(--dq-text);
            font-weight: 700;
        }

        .empty-notes {
            color: var(--dq-muted);
            font-size: 0.92rem;
            line-height: 1.6;
            margin: 0.5rem 0 0;
        }

        .mistake-note {
            border-radius: 12px;
            padding: 0.85rem 0.9rem;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(249, 244, 238, 0.75);
            margin-bottom: 0.75rem;
        }

        .mistake-note.slow-note {
            background: rgba(163, 67, 47, 0.09);
        }

        .mistake-note p {
            margin: 0.15rem 0;
            color: #2f2b29;
            font-size: 0.92rem;
            line-height: 1.45;
        }

        .mistake-note .note-kind {
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--dq-muted);
            margin-bottom: 0.25rem;
            font-weight: 700;
        }

        .dq-stat-boxes {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.75rem;
        }

        .dq-stat-box {
            background: rgba(235, 230, 224, 0.75);
            border-radius: 12px;
            padding: 0.8rem 0.9rem;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .dq-stat-box .dq-stat-label {
            display: block;
            font-size: 0.72rem;
            color: var(--dq-muted);
            margin-bottom: 0.35rem;
            line-height: 1.3;
        }

        .dq-stat-box .dq-stat-val {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--dq-text);
        }

        #key-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0.55rem;
        }

        .option-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.2rem 0.45rem;
            border-radius: 6px;
            font-size: 0.82rem;
            cursor: pointer;
            user-select: none;
            color: var(--dq-text);
        }

        .option-chip input {
            width: 1rem;
            height: 1rem;
            accent-color: var(--dq-accent);
            cursor: pointer;
        }

        #degree-scope-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0.55rem;
        }

        .dq-key-bulk {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 0.7rem;
        }

        .dq-key-bulk-btn {
            padding: 0.3rem 0.7rem;
            font-size: 0.78rem;
        }

        .dq-key-bulk-hint {
            margin: 0;
            width: 100%;
            font-size: 0.72rem;
            color: var(--dq-muted);
            line-height: 1.4;
        }
    </style>
</head>

    <main class="dq-page" style="padding-top: 100px;">
        <a href="../projects.html" class="dq-back" data-i18n="projects.back">← 返回项目</a>

        <header class="dq-page-header">
            <h1 data-quiz="heroTitle">调号级数测试</h1>
            <p class="dq-sub" data-quiz="heroSubtitle"></p>
            <div class="dq-app-lang">
                <button type="button" id="lang-en-btn">English</button>
                <button type="button" id="lang-zh-btn">中文</button>
            </div>
        </header>

        <div class="dq-grid">
            <!-- Top left: question -->
            <section class="dq-card dq-card--question">
                <div class="dq-card-head">
                    <span class="dq-head-primary" data-quiz="questionLabel">题目</span>
                    <button type="button" class="dq-btn-ghost" id="next-btn" data-quiz="nextButton">换一题</button>
                </div>
                <p id="question" class="dq-question" role="status"></p>
                <form id="answer-form" class="dq-form">
                    <label for="answer-input" data-quiz="answerLabel">你的答案</label>
                    <div class="dq-input-row">
                        <input id="answer-input" type="text" name="answer" autocomplete="off" spellcheck="false" />
                        <button type="submit" class="dq-btn-submit" data-quiz="submitButton">提交</button>
                    </div>
                </form>
                <p id="feedback" class="feedback" aria-live="polite"></p>
                <button type="button" class="dq-reveal-link" id="reveal-btn" data-quiz="revealButton">显示答案</button>
            </section>

            <!-- Top right: sticky notes / mistakes -->
            <section class="dq-card dq-card--notes">
                <div class="dq-card-head">
                    <span class="dq-head-primary" data-quiz="notesLabel">错题</span>
                    <button type="button" class="dq-btn-ghost" id="clear-notes-btn" data-quiz="clearButton">清空</button>
                </div>
                <h3 class="dq-notes-title" data-quiz="notesTitle">贴纸板</h3>
                <div id="mistake-notes"></div>
            </section>

            <!-- Bottom left: stats -->
            <section class="dq-card dq-card--stats">
                <div class="dq-card-head">
                    <span class="dq-head-primary" data-quiz="statsLabel">统计</span>
                    <span class="dq-head-secondary" data-quiz="progressTitle">进度</span>
                </div>
                <div class="dq-stat-boxes">
                    <div class="dq-stat-box">
                        <span class="dq-stat-label" data-quiz="setProgressLabel">本组进度</span>
                        <span class="dq-stat-val" id="total-count">0/10</span>
                    </div>
                    <div class="dq-stat-box">
                        <span class="dq-stat-label" data-quiz="correctLabel">答对</span>
                        <span class="dq-stat-val" id="correct-count">0</span>
                    </div>
                    <div class="dq-stat-box">
                        <span class="dq-stat-label" data-quiz="roundLabel">组数</span>
                        <span class="dq-stat-val" id="round-count">1</span>
                    </div>
                </div>
            </section>

            <!-- Bottom right: key options -->
            <section class="dq-card dq-card--keys">
                <div class="dq-card-head">
                    <span class="dq-head-primary" data-quiz="keyLabel">调号</span>
                    <span class="dq-head-secondary" data-quiz="keyTitle">12 个调</span>
                </div>
                <div class="dq-key-bulk">
                    <button type="button" class="dq-btn-ghost dq-key-bulk-btn" id="key-select-all" data-quiz="keySelectAll">全选</button>
                    <button type="button" class="dq-btn-ghost dq-key-bulk-btn" id="key-select-none" data-quiz="keySelectNone">全不选</button>
                    <p class="dq-key-bulk-hint" data-quiz="keyBulkHint"></p>
                </div>
                <div id="key-options"></div>
            </section>

            <!-- Full width: which degree types to practice (like key toggles) -->
            <section class="dq-card dq-card--degree-scope dq-card--span-full">
                <div class="dq-card-head">
                    <span class="dq-head-primary" data-quiz="degreeScopeLabel">级数范围</span>
                    <span class="dq-head-secondary" data-quiz="degreeScopeTitle">选题</span>
                </div>
                <div class="dq-key-bulk">
                    <button type="button" class="dq-btn-ghost dq-key-bulk-btn" id="degree-select-all" data-quiz="degreeSelectAll">全选</button>
                    <button type="button" class="dq-btn-ghost dq-key-bulk-btn" id="degree-select-none" data-quiz="degreeSelectNone">全不选</button>
                    <p class="dq-key-bulk-hint" data-quiz="degreeBulkHint"></p>
                </div>
                <div id="degree-scope-options"></div>
            </section>
        </div>
    </main>
