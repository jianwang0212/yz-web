<!DOCTYPE html>
<html lang="en" id="html-lang">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interval Quiz 音程测验：面向扩展和弦、音程识别与中英双语音乐理论练习。">
    <link rel="canonical" href="https://thisisyz.com/projects/interval-quiz">
    <title>音程测验 · Zi Yin</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        :root {
            --iq-cream: #f9f4ee;
            --iq-accent: #a3432f;
            --iq-accent-soft: rgba(163, 67, 47, 0.22);
            --iq-text: #1a1a1a;
            --iq-muted: #6b6560;
            --iq-card: #ffffff;
            --iq-chip-bg: #ebe6e0;
        }

        body.interval-quiz-body {
            background: var(--iq-cream) !important;
        }

        body.interval-quiz-body .navbar {
            background: rgba(255, 255, 255, 0.94) !important;
            border-bottom-color: rgba(0, 0, 0, 0.06);
        }

        body.interval-quiz-body .footer {
            background: transparent;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }

        .iq-page {
            max-width: 1040px;
            margin: 0 auto;
            padding: 2rem 1.15rem 3.5rem;
        }

        .iq-back {
            display: inline-block;
            margin-bottom: 1.25rem;
            color: var(--iq-accent);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .iq-back:hover {
            text-decoration: underline;
        }

        .iq-page-header {
            margin-bottom: 1.75rem;
            text-align: center;
        }

        .iq-page-header h1 {
            font-family: "Noto Serif SC", Georgia, "Times New Roman", serif;
            font-size: clamp(1.85rem, 4.5vw, 2.35rem);
            font-weight: 700;
            color: var(--iq-text);
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .iq-page-header .iq-sub {
            color: var(--iq-muted);
            font-size: 0.95rem;
            line-height: 1.65;
            max-width: 36rem;
            margin: 0 auto 1rem;
        }

        .iq-app-lang {
            display: flex;
            justify-content: center;
            gap: 0.45rem;
        }

        .iq-app-lang button {
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: #fff;
            font-size: 0.82rem;
            cursor: pointer;
            color: var(--iq-muted);
        }

        .iq-app-lang button.is-active {
            background: var(--iq-accent);
            color: #fff;
            border-color: var(--iq-accent);
        }

        .iq-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.15rem;
        }

        @media (min-width: 820px) {
            .iq-grid {
                grid-template-columns: 1fr 1fr;
                grid-auto-rows: minmax(min-content, auto);
            }
        }

        .iq-card {
            background: var(--iq-card);
            border-radius: 14px;
            padding: 1.15rem 1.25rem 1.35rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .iq-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.9rem;
            gap: 0.75rem;
        }

        .iq-card-head .iq-head-primary {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--iq-text);
        }

        .iq-card-head .iq-head-secondary {
            font-size: 0.88rem;
            color: var(--iq-muted);
            font-weight: 500;
        }

        .iq-btn-ghost {
            padding: 0.38rem 0.85rem;
            border-radius: 8px;
            border: none;
            background: var(--iq-chip-bg);
            color: #3d3835;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
        }

        .iq-btn-ghost:hover {
            filter: brightness(0.97);
        }

        .iq-question {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--iq-text);
            margin-bottom: 1.1rem;
            line-height: 1.4;
        }

        .iq-form label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--iq-muted);
            margin-bottom: 0.4rem;
        }

        .iq-input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: stretch;
            margin-bottom: 0.65rem;
        }

        .iq-form input[type="text"] {
            flex: 1;
            min-width: 140px;
            padding: 0.65rem 0.85rem;
            border: 1px solid var(--iq-accent-soft);
            border-radius: 8px;
            font-size: 1rem;
            background: #fffefd;
        }

        .iq-form input[type="text"]:focus {
            outline: 2px solid rgba(163, 67, 47, 0.25);
            outline-offset: 1px;
        }

        .iq-btn-submit {
            padding: 0.65rem 1.25rem;
            border-radius: 8px;
            border: none;
            background: var(--iq-accent);
            color: #fff;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .iq-btn-submit:hover {
            filter: brightness(1.05);
        }

        .iq-voice-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.6rem 0.8rem;
            margin: 0 0 0.95rem;
        }

        .iq-voice-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.42rem;
            font-size: 0.84rem;
            color: var(--iq-text);
            cursor: pointer;
            user-select: none;
        }

        .iq-voice-toggle input {
            width: 1rem;
            height: 1rem;
            accent-color: var(--iq-accent);
            cursor: pointer;
        }

        .iq-voice-status {
            font-size: 0.8rem;
            color: var(--iq-muted);
            margin: 0;
            min-height: 1.1rem;
        }

        .feedback {
            min-height: 1.35rem;
            margin: 0.65rem 0 0.35rem;
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .feedback.success {
            color: #15803d;
        }

        .feedback.error {
            color: #b91c1c;
        }

        .iq-reveal-link {
            display: inline-block;
            margin-top: 0.25rem;
            padding: 0;
            border: none;
            background: none;
            color: var(--iq-accent);
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .iq-shortcuts {
            margin: 0.85rem 0 0;
            font-size: 0.78rem;
            line-height: 1.5;
            color: var(--iq-muted);
        }

        .iq-notes-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--iq-text);
            margin-bottom: 0.5rem;
        }

        #mistake-notes {
            min-height: 4rem;
            max-height: 280px;
            overflow-y: auto;
        }

        .empty-notes {
            color: var(--iq-muted);
            font-size: 0.88rem;
            line-height: 1.55;
        }

        .mistake-note {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: var(--iq-cream);
            font-size: 0.82rem;
        }

        .mistake-note.slow-note {
            border-color: rgba(163, 67, 47, 0.2);
        }

        .mistake-note .note-kind {
            font-weight: 600;
            color: var(--iq-accent);
            margin-bottom: 0.25rem;
        }

        .mistake-question {
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .iq-progress-block {
            margin-bottom: 1rem;
        }

        .iq-progress-track {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            background: #efe7de;
            overflow: hidden;
        }

        .iq-progress-fill {
            display: block;
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, #a3432f 0%, #d07658 100%);
            transition: width 180ms ease;
        }

        .iq-progress-caption {
            margin: 0.55rem 0 0;
            font-size: 0.82rem;
            line-height: 1.5;
            color: var(--iq-muted);
        }

        .iq-stat-boxes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 0.65rem;
        }

        @media (max-width: 360px) {
            .iq-stat-boxes {
                grid-template-columns: 1fr;
            }
        }

        .iq-stat-box {
            background: #efebe6;
            border-radius: 10px;
            padding: 0.85rem 0.65rem;
            text-align: center;
        }

        .iq-stat-box .iq-stat-label {
            display: block;
            font-size: 0.72rem;
            color: var(--iq-muted);
            margin-bottom: 0.35rem;
            line-height: 1.3;
        }

        .iq-stat-box .iq-stat-val {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--iq-text);
        }

        .iq-focus-title {
            margin: 1rem 0 0.45rem;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--iq-muted);
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .iq-pill-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
        }

        .iq-pill {
            display: inline-flex;
            align-items: center;
            min-height: 2rem;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            background: #f3ede5;
            color: #4a413b;
            font-size: 0.8rem;
            line-height: 1.3;
        }

        .iq-pill--muted {
            color: var(--iq-muted);
            background: #f5f1eb;
        }

        .iq-preset-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.7rem;
        }

        .iq-preset-btn {
            padding: 0.42rem 0.78rem;
            border-radius: 999px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: #fff;
            color: var(--iq-muted);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .iq-preset-btn.is-active {
            background: var(--iq-accent);
            color: #fff;
            border-color: var(--iq-accent);
        }

        .iq-section-help {
            margin: 0 0 0.8rem;
            font-size: 0.82rem;
            line-height: 1.55;
            color: var(--iq-muted);
        }

        #interval-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0.55rem;
        }

        .option-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.2rem 0.45rem;
            border-radius: 6px;
            font-size: 0.82rem;
            cursor: pointer;
            user-select: none;
            color: var(--iq-text);
        }

        .option-chip input {
            width: 1rem;
            height: 1rem;
            accent-color: var(--iq-accent);
            cursor: pointer;
        }

        .iq-keyboard-panel {
            margin-top: 1rem;
        }

        .iq-keyboard-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--iq-text);
            margin: 0 0 0.35rem;
        }

        .iq-keyboard-hint {
            font-size: 0.82rem;
            color: var(--iq-muted);
            margin: 0 0 0.85rem;
            line-height: 1.5;
        }

        .iq-piano {
            position: relative;
            height: 132px;
            max-width: 560px;
            margin: 0 auto 1rem;
        }

        .iq-piano-whites {
            display: flex;
            gap: 3px;
            height: 100%;
        }

        .iq-key--white {
            flex: 1;
            min-width: 0;
            border: 1px solid rgba(0, 0, 0, 0.12);
            border-radius: 0 0 8px 8px;
            background: linear-gradient(180deg, #fff 0%, #f3f0ec 100%);
            font-size: clamp(0.68rem, 2.2vw, 0.82rem);
            font-weight: 600;
            color: var(--iq-text);
            cursor: pointer;
            padding-top: 0.45rem;
            font-family: inherit;
        }

        .iq-key--white:hover {
            filter: brightness(0.97);
        }

        .iq-key--white:active {
            transform: translateY(1px);
        }

        .iq-piano-blacks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 58%;
            pointer-events: none;
        }

        .iq-key--black {
            position: absolute;
            top: 0;
            height: 100%;
            border: none;
            border-radius: 0 0 5px 5px;
            background: linear-gradient(180deg, #2a2a2a 0%, #0f0f0f 100%);
            color: rgba(255, 255, 255, 0.92);
            font-size: clamp(0.58rem, 1.8vw, 0.68rem);
            font-weight: 600;
            cursor: pointer;
            pointer-events: auto;
            font-family: inherit;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        .iq-key--black:hover {
            filter: brightness(1.08);
        }

        .iq-key--black:active {
            transform: translateY(1px);
        }

        .iq-midi-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.65rem;
            margin-top: 0.25rem;
        }

        .iq-midi-status {
            font-size: 0.78rem;
            color: var(--iq-muted);
            margin: 0;
            flex: 1;
            min-width: 12rem;
        }
    </style>

    <main class="iq-page" style="padding-top: 100px;">
        <a href="../projects.html" class="iq-back" data-i18n="projects.back">← 返回项目</a>

        <header class="iq-page-header">
            <h1 data-quiz="heroTitle">音程测验</h1>
            <p class="iq-sub" data-quiz="heroSubtitle"></p>
            <div class="iq-app-lang">
                <button type="button" id="lang-en-btn">English</button>
                <button type="button" id="lang-zh-btn">中文</button>
            </div>
        </header>

        <div class="iq-grid">
            <!-- Top left: question -->
            <section class="iq-card iq-card--question">
                <div class="iq-card-head">
                    <span class="iq-head-primary" data-quiz="questionLabel">题目</span>
                    <button type="button" class="iq-btn-ghost" id="next-btn" data-quiz="nextButton">换一题</button>
                </div>
                <p id="question" class="iq-question" role="status"></p>
                <div class="iq-voice-row">
                    <label class="iq-voice-toggle">
                        <input type="checkbox" id="voice-auto-toggle" checked />
                        <span data-quiz="voiceAuto">自动播报</span>
                    </label>
                    <button type="button" class="iq-btn-ghost" id="voice-repeat-btn" data-quiz="voiceRepeat">再念一次</button>
                    <p class="iq-voice-status" id="voice-status" data-quiz="voiceReady">语音已就绪</p>
                </div>
                <form id="answer-form" class="iq-form">
                    <label for="answer-input" data-quiz="answerLabel">你的答案</label>
                    <div class="iq-input-row">
                        <input id="answer-input" type="text" name="answer" autocomplete="off" spellcheck="false" />
                        <button type="submit" class="iq-btn-submit" data-quiz="submitButton">提交</button>
                    </div>
                </form>
                <p id="feedback" class="feedback" aria-live="polite"></p>
                <button type="button" class="iq-reveal-link" id="reveal-btn" data-quiz="revealButton">显示答案</button>
                <p class="iq-shortcuts" data-quiz="shortcutHint"></p>
            </section>

            <!-- Top right: sticky notes / mistakes -->
            <section class="iq-card iq-card--notes">
                <div class="iq-card-head">
                    <span class="iq-head-primary" data-quiz="notesLabel">错题</span>
                    <button type="button" class="iq-btn-ghost" id="clear-notes-btn" data-quiz="clearButton">清空</button>
                </div>
                <h3 class="iq-notes-title" data-quiz="notesTitle">贴纸板</h3>
                <div id="mistake-notes"></div>
            </section>

            <!-- Bottom left: stats -->
            <section class="iq-card iq-card--stats">
                <div class="iq-card-head">
                    <span class="iq-head-primary" data-quiz="statsLabel">统计</span>
                    <span class="iq-head-secondary" data-quiz="progressTitle">进度</span>
                </div>
                <div class="iq-progress-block">
                    <div class="iq-progress-track" aria-hidden="true">
                        <span class="iq-progress-fill" id="set-progress-bar"></span>
                    </div>
                    <p class="iq-progress-caption" id="set-progress-copy"></p>
                </div>
                <div class="iq-stat-boxes">
                    <div class="iq-stat-box">
                        <span class="iq-stat-label" data-quiz="setProgressLabel">本组进度</span>
                        <span class="iq-stat-val" id="total-count">0/10</span>
                    </div>
                    <div class="iq-stat-box">
                        <span class="iq-stat-label" data-quiz="correctLabel">答对</span>
                        <span class="iq-stat-val" id="correct-count">0</span>
                    </div>
                    <div class="iq-stat-box">
                        <span class="iq-stat-label" data-quiz="roundLabel">组数</span>
                        <span class="iq-stat-val" id="accuracy-count">1</span>
                    </div>
                    <div class="iq-stat-box">
                        <span class="iq-stat-label" data-quiz="remainingLabel">剩余</span>
                        <span class="iq-stat-val" id="remaining-count">10</span>
                    </div>
                    <div class="iq-stat-box">
                        <span class="iq-stat-label" data-quiz="streakLabel">连对</span>
                        <span class="iq-stat-val" id="streak-count">0</span>
                    </div>
                    <div class="iq-stat-box">
                        <span class="iq-stat-label" data-quiz="bestStreakLabel">最高连对</span>
                        <span class="iq-stat-val" id="best-streak-count">0</span>
                    </div>
                    <div class="iq-stat-box">
                        <span class="iq-stat-label" data-quiz="avgTimeLabel">平均用时</span>
                        <span class="iq-stat-val" id="avg-time-count">--</span>
                    </div>
                </div>
                <p class="iq-focus-title" data-quiz="focusTitle">重点关注</p>
                <div class="iq-pill-row" id="focus-intervals"></div>
            </section>

            <!-- Bottom right: interval checkboxes -->
            <section class="iq-card iq-card--intervals">
                <div class="iq-card-head">
                    <span class="iq-head-primary" data-quiz="intervalLabel">题型</span>
                    <span class="iq-head-secondary" data-quiz="intervalTitle">扩展音程</span>
                </div>
                <div class="iq-preset-row">
                    <button type="button" class="iq-preset-btn" data-preset="core" data-quiz="presetCore">和弦音</button>
                    <button type="button" class="iq-preset-btn" data-preset="extensions" data-quiz="presetExtensions">延伸音</button>
                    <button type="button" class="iq-preset-btn" data-preset="all" data-quiz="presetAll">全部</button>
                </div>
                <p class="iq-section-help" data-quiz="intervalHelper"></p>
                <div id="interval-options"></div>
            </section>
        </div>

        <section class="iq-card iq-keyboard-panel">
            <h2 class="iq-keyboard-title" data-quiz="keyboardTitle">键盘输入</h2>
            <p class="iq-keyboard-hint" data-quiz="keyboardHint"></p>
            <div class="iq-piano" id="iq-piano" aria-label="Piano"></div>
            <div class="iq-midi-row">
                <button type="button" class="iq-btn-ghost" id="midi-enable-btn" data-quiz="midiEnable">开启 MIDI</button>
                <p class="iq-midi-status" id="midi-status" data-quiz="midiIdle"></p>
            </div>
        </section>
    </main>

            </div>
        </div>
    </footer>
