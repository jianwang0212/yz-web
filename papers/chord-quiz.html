<!DOCTYPE html>
<html lang="en" id="html-lang">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chord Quiz：MIDI 和弦听辨与演奏测验，不需要键盘打字，适合爵士和流行和声训练。">
    <link rel="canonical" href="https://thisisyz.com/projects/chord-quiz">
    <title>和弦测验 · Zi Yin</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        :root {
            --iq-cream: #f9f4ee;
            --iq-accent: #a3432f;
            --iq-accent-soft: rgba(163, 67, 47, 0.22);
            --iq-text: #1a1a1a;
            --iq-muted: #6b6560;
            --iq-card: #ffffff;
            --iq-chip-bg: #ebe6e0;
        }

        body.interval-quiz-body {
            background: var(--iq-cream) !important;
        }

        body.interval-quiz-body .navbar {
            background: rgba(255, 255, 255, 0.94) !important;
            border-bottom-color: rgba(0, 0, 0, 0.06);
        }

        body.interval-quiz-body .footer {
            background: transparent;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }

        .iq-page {
            max-width: 1040px;
            margin: 0 auto;
            padding: 2rem 1.15rem 3.5rem;
        }

        .iq-back {
            display: inline-block;
            margin-bottom: 1.25rem;
            color: var(--iq-accent);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .iq-back:hover {
            text-decoration: underline;
        }

        .iq-page-header {
            margin-bottom: 1.75rem;
            text-align: center;
        }

        .iq-page-header h1 {
            font-family: "Noto Serif SC", Georgia, "Times New Roman", serif;
            font-size: clamp(1.85rem, 4.5vw, 2.35rem);
            font-weight: 700;
            color: var(--iq-text);
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .iq-page-header .iq-sub {
            color: var(--iq-muted);
            font-size: 0.95rem;
            line-height: 1.65;
            max-width: 36rem;
            margin: 0 auto 1rem;
        }

        .iq-app-lang {
            display: flex;
            justify-content: center;
            gap: 0.45rem;
        }

        .iq-app-lang button {
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: #fff;
            font-size: 0.82rem;
            cursor: pointer;
            color: var(--iq-muted);
        }

        .iq-app-lang button.is-active {
            background: var(--iq-accent);
            color: #fff;
            border-color: var(--iq-accent);
        }

        .iq-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.15rem;
        }

        @media (min-width: 820px) {
            .iq-grid {
                grid-template-columns: 1fr 1fr;
                grid-auto-rows: minmax(min-content, auto);
            }
        }

        .iq-card {
            background: var(--iq-card);
            border-radius: 14px;
            padding: 1.15rem 1.25rem 1.35rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .iq-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.9rem;
            gap: 0.75rem;
        }

        .iq-card-head .iq-head-primary {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--iq-text);
        }

        .iq-card-head .iq-head-secondary {
            font-size: 0.88rem;
            color: var(--iq-muted);
            font-weight: 500;
        }

        .iq-btn-ghost {
            padding: 0.38rem 0.85rem;
            border-radius: 8px;
            border: none;
            background: var(--iq-chip-bg);
            color: #3d3835;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
        }

        .iq-btn-ghost:hover {
            filter: brightness(0.97);
        }

        .iq-question {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--iq-text);
            margin-bottom: 1.1rem;
            line-height: 1.4;
            min-height: 2.5rem;
        }

        .iq-form label,
        .iq-pressed-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--iq-muted);
            margin-bottom: 0.4rem;
        }

        .iq-input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: stretch;
            margin-bottom: 0.65rem;
        }

        .iq-btn-submit {
            padding: 0.65rem 1.25rem;
            border-radius: 8px;
            border: none;
            background: var(--iq-accent);
            color: #fff;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .iq-btn-submit:hover {
            filter: brightness(1.05);
        }

        .feedback {
            min-height: 1.35rem;
            margin: 0.65rem 0 0.35rem;
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .feedback.success {
            color: #15803d;
        }

        .feedback.error {
            color: #b91c1c;
        }

        .iq-reveal-link {
            display: inline-block;
            margin-top: 0.25rem;
            padding: 0;
            border: none;
            background: none;
            color: var(--iq-accent);
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .iq-notes-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--iq-text);
            margin-bottom: 0.5rem;
        }

        #mistake-notes {
            min-height: 4rem;
            max-height: 280px;
            overflow-y: auto;
        }

        .empty-notes {
            color: var(--iq-muted);
            font-size: 0.88rem;
            line-height: 1.55;
        }

        .mistake-note {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: var(--iq-cream);
            font-size: 0.82rem;
        }

        .mistake-note.slow-note {
            border-color: rgba(163, 67, 47, 0.2);
        }

        .mistake-note .note-kind {
            font-weight: 600;
            color: var(--iq-accent);
            margin-bottom: 0.25rem;
        }

        .mistake-question {
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .iq-stat-boxes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.65rem;
        }

        @media (max-width: 480px) {
            .iq-stat-boxes {
                grid-template-columns: 1fr;
            }
        }

        .iq-stat-box {
            background: #efebe6;
            border-radius: 10px;
            padding: 0.85rem 0.65rem;
            text-align: center;
        }

        .iq-stat-box .iq-stat-label {
            display: block;
            font-size: 0.72rem;
            color: var(--iq-muted);
            margin-bottom: 0.35rem;
            line-height: 1.3;
        }

        .iq-stat-box .iq-stat-val {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--iq-text);
        }

        #chord-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0.55rem;
        }

        .option-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.2rem 0.45rem;
            border-radius: 6px;
            font-size: 0.82rem;
            cursor: pointer;
            user-select: none;
            color: var(--iq-text);
        }

        .option-chip input {
            width: 1rem;
            height: 1rem;
            accent-color: var(--iq-accent);
            cursor: pointer;
        }

        #midi-gate {
            margin-bottom: 1rem;
            padding: 1rem 1.1rem;
            border-radius: 10px;
            background: var(--iq-chip-bg);
            border: 1px solid var(--iq-accent-soft);
        }

        #midi-gate .iq-midi-gate-lead {
            margin: 0 0 0.85rem;
            font-size: 0.9rem;
            color: var(--iq-text);
            line-height: 1.5;
        }

        #pressed-display {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--iq-text);
            margin: 0 0 0.85rem;
            letter-spacing: 0.02em;
        }

        .iq-keyboard-panel {
            margin-top: 1rem;
        }

        .iq-keyboard-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--iq-text);
            margin: 0 0 0.35rem;
        }

        .iq-keyboard-hint {
            font-size: 0.82rem;
            color: var(--iq-muted);
            margin: 0 0 0.85rem;
            line-height: 1.5;
        }

        .iq-midi-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.65rem;
            margin-top: 0.25rem;
        }

        .iq-midi-status {
            font-size: 0.78rem;
            color: var(--iq-muted);
            margin: 0;
            flex: 1;
            min-width: 12rem;
        }
    </style>

    <main class="iq-page" style="padding-top: 100px;">
        <a href="../projects.html" class="iq-back" data-i18n="projects.back">← 返回项目</a>

        <header class="iq-page-header">
            <h1 data-quiz="heroTitle">Chord Quiz (MIDI)</h1>
            <p class="iq-sub" data-quiz="heroSubtitle"></p>
            <div class="iq-app-lang">
                <button type="button" id="lang-en-btn">English</button>
                <button type="button" id="lang-zh-btn">中文</button>
            </div>
        </header>

        <div class="iq-grid">
            <section class="iq-card iq-card--question">
                <div class="iq-card-head">
                    <span class="iq-head-primary" data-quiz="questionLabel">题目</span>
                    <button type="button" class="iq-btn-ghost" id="next-btn" data-quiz="nextButton">换一题</button>
                </div>
                <div id="midi-gate">
                    <p class="iq-midi-gate-lead" data-quiz="needMidiFirst"></p>
                    <div class="iq-midi-row">
                        <button type="button" class="iq-btn-ghost" id="midi-enable-btn" data-quiz="midiEnable">开启 MIDI</button>
                    </div>
                </div>
                <p id="question" class="iq-question" role="status"></p>
                <div class="iq-form">
                    <span class="iq-pressed-label" data-quiz="pressedLabel">Currently held</span>
                    <p id="pressed-display" aria-live="polite">—</p>
                    <div class="iq-input-row">
                        <button type="button" class="iq-btn-submit" id="check-btn" data-quiz="checkButton">检查</button>
                    </div>
                </div>
                <p id="feedback" class="feedback" aria-live="polite"></p>
                <button type="button" class="iq-reveal-link" id="reveal-btn" data-quiz="revealButton">显示答案</button>
            </section>

            <section class="iq-card iq-card--notes">
                <div class="iq-card-head">
                    <span class="iq-head-primary" data-quiz="notesLabel">错题</span>
                    <button type="button" class="iq-btn-ghost" id="clear-notes-btn" data-quiz="clearButton">清空</button>
                </div>
                <h3 class="iq-notes-title" data-quiz="notesTitle">贴纸板</h3>
                <div id="mistake-notes"></div>
            </section>

            <section class="iq-card iq-card--stats">
                <div class="iq-card-head">
                    <span class="iq-head-primary" data-quiz="statsLabel">统计</span>
                    <span class="iq-head-secondary" data-quiz="progressTitle">进度</span>
                </div>
                <div class="iq-stat-boxes">
                    <div class="iq-stat-box">
                        <span class="iq-stat-label" data-quiz="setProgressLabel">本组进度</span>
                        <span class="iq-stat-val" id="total-count">0/10</span>
                    </div>
                    <div class="iq-stat-box">
                        <span class="iq-stat-label" data-quiz="correctLabel">答对</span>
                        <span class="iq-stat-val" id="correct-count">0</span>
                    </div>
                    <div class="iq-stat-box">
                        <span class="iq-stat-label" data-quiz="roundLabel">组数</span>
                        <span class="iq-stat-val" id="round-count">1</span>
                    </div>
                </div>
            </section>

            <section class="iq-card iq-card--intervals">
                <div class="iq-card-head">
                    <span class="iq-head-primary" data-quiz="chordLabel">和弦类型</span>
                    <span class="iq-head-secondary" data-quiz="chordTitle">选题范围</span>
                </div>
                <div id="chord-options"></div>
            </section>
        </div>

        <section class="iq-card iq-keyboard-panel">
            <h2 class="iq-keyboard-title" data-quiz="midiSectionTitle">MIDI</h2>
            <p class="iq-keyboard-hint" data-quiz="midiHint"></p>
            <div class="iq-midi-row">
                <p class="iq-midi-status" id="midi-status" data-quiz="midiIdle"></p>
            </div>
        </section>
    </main>
